<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<linearGradient id="stk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
<style>
.br{fill:none;stroke:#2dd4bf;stroke-width:30;stroke-linecap:round;stroke-linejoin:round;animation:pulse 3s ease-in-out infinite;transform-origin:256px 256px}
.l{animation:drop 3s ease-out infinite}
.l2{animation-delay:.25s}.l3{animation-delay:.5s}
@keyframes drop{0%{transform:translateY(-50px);opacity:0}25%,85%{transform:translateY(0);opacity:1}100%{opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
</style></defs>
<rect width="512" height="512" rx="112" fill="url(#bg)"/>
<g class="br"><polyline points="140,166 80,256 140,346"/><polyline points="372,166 432,256 372,346"/></g>
<rect class="l" x="181" y="176" width="150" height="38" rx="12" fill="url(#stk)"/>
<rect class="l l2" x="196" y="237" width="120" height="38" rx="12" fill="url(#stk)" opacity=".8"/>
<rect class="l l3" x="211" y="298" width="90" height="38" rx="12" fill="url(#stk)" opacity=".6"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
